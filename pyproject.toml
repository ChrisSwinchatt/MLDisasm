[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mldisasm"
version = "0.2.0"
description = "Machine learning-based disassembler"
readme = "ReadMe.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Chris Swinchatt" }
]
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
full = [
    "colorama",
    "psutil",
    "ujson",
]

[project.scripts]
mldisasm = "mldisasm.cli:disassemble"
mldisasm-train = "mldisasm.cli:train"
mldisasm-tune = "mldisasm.cli:tune"
mldisasm-validate = "mldisasm.cli:validate"

[tool.setuptools.packages.find]
where = ["src"]
